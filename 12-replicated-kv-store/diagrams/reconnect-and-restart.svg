<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">reconnect and restart</title><desc id="desc">A disconnected follower keeps its sequence. A restarted follower rebuilds state from sequence zero.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53647a"/></marker></defs><rect width="1000" height="450" fill="#fff"/><text x="36" y="49" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#243247">Catch-up differs for reconnects and process restarts</text>
<text x="36" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">The leader must still be running with the same in-memory history [1, 2, 3, 4].</text>
<rect x="50" y="125" width="900" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="158" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Temporary network outage. Follower process survives</text>
<text x="70" y="193" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#166534">Keeps lastSeq = 2 -&gt; request from=2 -&gt; apply [3, 4]</text>
<rect x="50" y="255" width="900" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="288" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">The follower restarts and loses its local state</text>
<text x="70" y="323" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#166534">Starts at lastSeq = 0 -&gt; request from=0 -&gt; replay [1, 2, 3, 4]</text>
<text x="50" y="429" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">A leader restart loses the source log too. There is no durable checkpoint or automatic failover.</text></svg>
