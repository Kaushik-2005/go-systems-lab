<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">sequence validation</title><desc id="desc">A follower ignores an old sequence, accepts the next sequence, and rejects a gap.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53647a"/></marker></defs><rect width="1000" height="470" fill="#fff"/><text x="36" y="49" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#243247">Ordered apply: accept the next sequence, ignore old records</text>
<text x="36" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Follower starts at lastSeq = 2. Each row below is an independent incoming-record case.</text>
<rect x="50" y="125" width="350" height="65" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="158" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Receive sequence 2</text>
<path d="M 410 157 L 535 157" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="545" y="125" width="405" height="65" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="561" y="158" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Already applied -&gt; ignore</text>
<rect x="50" y="225" width="350" height="65" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="258" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Receive sequence 3</text>
<path d="M 410 257 L 535 257" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="545" y="225" width="405" height="65" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="561" y="258" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">Apply -&gt; lastSeq becomes 3</text>
<rect x="50" y="325" width="350" height="65" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="358" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Receive sequence 4</text>
<path d="M 410 357 L 535 357" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="545" y="325" width="405" height="65" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="561" y="358" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#b91c1c">Gap -&gt; ErrOutOfOrder</text>
<text x="50" y="447" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Sequence covers the whole mutation log, rather than one key. Deletes are ordered records too.</text></svg>
