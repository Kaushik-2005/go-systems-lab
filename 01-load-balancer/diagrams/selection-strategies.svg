<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">selection strategies</title><desc id="desc">The selectors use round-robin order, random selection, or active-request counts.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53647a"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M 8 0 L 0 4 L 8 8" fill="none" stroke="#53647a"/></marker></defs><rect width="1000" height="470" fill="#fff"/><text x="36" y="50" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#243247">Three selection strategies, one healthy backend list</text>
<text x="36" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Example list: [A, B, C]  |  unhealthy backends have already been filtered out.</text>
<rect x="50" y="120" width="900" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="154" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Round robin</text>
<text x="75" y="180" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243247">Requests 1, 2, 3, 4, 5, 6  -&gt;  A, B, C, A, B, C</text>
<rect x="50" y="220" width="900" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="254" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Random</text>
<text x="75" y="280" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243247">Each request picks a random backend. Example: B, B, A, C, A, C</text>
<rect x="50" y="320" width="900" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="354" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Least connections</text>
<text x="75" y="380" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243247">Active requests: A = 4, B = 1, C = 3  -&gt;  choose B</text>
<text x="50" y="443" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Here, least connections measures active proxied requests, rather than open sockets.</text></svg>
