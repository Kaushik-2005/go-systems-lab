<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">request routing</title><desc id="desc">The load balancer sends requests to healthy backends.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53647a"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M 8 0 L 0 4 L 8 8" fill="none" stroke="#53647a"/></marker></defs><rect width="1000" height="440" fill="#fff"/><text x="36" y="50" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#243247">Request routing: choose from healthy backends</text>
<text x="36" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">The client uses one address. The reverse proxy forwards requests and responses.</text>
<rect x="50" y="170" width="150" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="204" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Client :8080</text>
<rect x="300" y="170" width="270" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="316" y="204" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Filter healthy + select</text>
<path d="M 204 201 L 290 201" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="735" y="110" width="215" height="60" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="751" y="144" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">A :9000 healthy</text>
<rect x="735" y="210" width="215" height="60" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="751" y="244" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">B :9001 healthy</text>
<rect x="735" y="310" width="215" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="751" y="344" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#b91c1c">C :9002 unhealthy</text>
<path d="M 575 192 L 725 140" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 575 210 L 725 240" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="596" y="311" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#b91c1c">Skip C</text>
<text x="50" y="299" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Before forwarding: increment active count and set request timeout.</text>
<text x="50" y="334" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">After forwarding: decrement active count, even on failure.</text>
<text x="50" y="401" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243247">No healthy backends: 503. Proxy error: 502 and mark the backend unhealthy.</text></svg>
