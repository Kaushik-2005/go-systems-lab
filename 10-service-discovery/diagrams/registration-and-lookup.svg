<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">registration and lookup</title><desc id="desc">A service registers its address. A client looks up the service and then connects directly to a returned instance.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53647a"/></marker></defs><rect width="1000" height="450" fill="#fff"/><text x="36" y="49" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#243247">Service discovery: register an address, then look it up</text>
<text x="36" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">The registry returns addresses; the client chooses an instance and connects to it.</text>
<rect x="50" y="150" width="240" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="183" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">payments-1</text>
<text x="68" y="213" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">localhost:9001</text>
<rect x="390" y="150" width="240" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="406" y="183" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Registry</text>
<text x="408" y="213" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">payments -&gt; instances</text>
<rect x="730" y="150" width="220" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="746" y="183" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Client</text>
<text x="748" y="213" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Lookup(&quot;payments&quot;)</text>
<path d="M 300 181 L 380 181" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="296" y="134" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243247">Register</text>
<path d="M 720 181 L 640 181" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="665" y="134" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#243247">Lookup</text>
<path d="M 640 226 L 720 226" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="645" y="284" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#166534">Addresses</text>
<rect x="50" y="325" width="900" height="70" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="66" y="358" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">Client -&gt; localhost:9001 directly; application traffic does not pass through the registry</text></svg>
