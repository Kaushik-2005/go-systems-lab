<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">append and checksum</title><desc id="desc">A mutation is encoded with its sequence and SHA-224 checksum, appended with a newline, and synced before the caller receives the record.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53647a"/></marker></defs><rect width="1000" height="450" fill="#fff"/><text x="36" y="49" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#243247">Write ahead: sync the record before applying the change</text>
<text x="36" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Append returns a record after writing and syncing; the application owns state updates.</text>
<rect x="50" y="140" width="180" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="173" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Build record</text>
<path d="M 240 176 L 280 176" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="290" y="140" width="180" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="306" y="173" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Encode JSON</text>
<path d="M 480 176 L 520 176" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="530" y="140" width="180" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="546" y="173" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Append + Sync</text>
<path d="M 720 176 L 760 176" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="770" y="140" width="180" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="786" y="173" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Return record</text>
<rect x="50" y="260" width="900" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="293" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Record: sequence = 0, payload = &quot;PUT language Go&quot;, checksum = hex digest</text>
<text x="50" y="391" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243247">Checksum = SHA-224 of the bytes in &quot;sequence:payload&quot;.</text>
<text x="50" y="427" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Next append uses sequence 1. Apply to application memory only after Append succeeds.</text></svg>
