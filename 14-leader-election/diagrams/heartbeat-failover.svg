<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">heartbeat failover</title><desc id="desc">After A stops heartbeating B times out and wins with C. Majority requirements still apply when the old leader is unavailable.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53647a"/></marker></defs><rect width="1000" height="470" fill="#fff"/><text x="36" y="49" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#243247">Heartbeat loss: followers eventually start a new election</text>
<text x="36" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Node command: heartbeats every 100 ms; randomized timeouts from 300 ms to under 600 ms.</text>
<rect x="50" y="125" width="900" height="65" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="158" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Leader A sends heartbeats -&gt; followers B and C reset their election timers</text>
<path d="M 500 198 L 500 217" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="225" width="900" height="65" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="258" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">A stops -&gt; B reaches its timeout first -&gt; B starts an election in a higher term</text>
<path d="M 500 298 L 500 317" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="325" width="900" height="65" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="66" y="358" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">B gets C's vote -&gt; 2 of 3 votes -&gt; B becomes leader and sends heartbeats</text>
<text x="50" y="447" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Randomization reduces split votes; failed elections can retry after another timeout.</text></svg>
