<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">election states</title><desc id="desc">A follower timeout starts a candidacy with a new term. Majority voting elects a leader; higher-term messages cause step-down.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53647a"/></marker></defs><rect width="1000" height="480" fill="#fff"/><text x="36" y="49" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#243247">Leader election: timeout, campaign, then win a majority</text>
<text x="36" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Terms separate elections. A valid leader heartbeat keeps a follower from timing out.</text>
<rect x="50" y="145" width="240" height="85" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="178" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">FOLLOWER</text>
<rect x="380" y="145" width="240" height="85" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="396" y="178" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">CANDIDATE</text>
<rect x="710" y="145" width="240" height="85" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="726" y="178" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">LEADER</text>
<path d="M 300 187 L 370 187" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 630 187 L 700 187" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="50" y="278" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Timeout -&gt; term + 1</text>
<text x="380" y="278" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Self-vote + peer votes</text>
<text x="710" y="278" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#166534">Send heartbeats</text>
<rect x="50" y="325" width="900" height="75" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="358" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Higher-term vote request or heartbeat -&gt; step down to follower and adopt that term</text>
<text x="50" y="460" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Older terms are rejected. Same-term heartbeats also make a candidate follow the leader.</text></svg>
