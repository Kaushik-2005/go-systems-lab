<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">topic fanout</title><desc id="desc">Event E1 enters the separate buffers for subscribers A and B.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53647a"/></marker></defs><rect width="1000" height="450" fill="#ffffff"/><text x="36" y="49" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#243247">Pub/sub: each subscriber gets its own copy</text>
<text x="36" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">A topic maps subscription IDs to private buffered channels.</text>
<rect x="50" y="205" width="200" height="65" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="238" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Publish event E1</text>
<rect x="355" y="205" width="200" height="65" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="371" y="238" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Topic: news</text>
<path d="M 260 237 L 345 237" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="715" y="125" width="235" height="65" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="731" y="158" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">A buffer: [E1]</text>
<rect x="715" y="300" width="235" height="65" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="731" y="333" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">B buffer: [E1]</text>
<path d="M 565 222 L 705 157" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 565 251 L 705 332" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="50" y="338" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Snapshot current subscribers,</text>
<text x="50" y="367" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">then release the broker lock.</text>
<text x="50" y="427" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243247">Reading E1 from A does not remove it from B. Late subscribers receive no replay.</text></svg>
