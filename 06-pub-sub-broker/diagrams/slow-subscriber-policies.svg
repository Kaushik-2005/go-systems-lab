<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">slow subscriber policies</title><desc id="desc">Publish waits for buffer space. PublishNonBlocking skips a full buffer.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53647a"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/><text x="36" y="49" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#243247">Slow subscribers: wait or skip the full buffer</text>
<text x="36" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Buffer capacity = 1. The buffer holds E1 while the publisher attempts E2.</text>
<rect x="50" y="125" width="900" height="105" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="158" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Publish: blocking delivery</text>
<text x="70" y="188" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243247">[E1] full -&gt; sending E2 waits -&gt; subscriber reads E1 -&gt; E2 enters buffer</text>
<rect x="50" y="255" width="900" height="105" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="66" y="288" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#b91c1c">PublishNonBlocking: skip unavailable delivery</text>
<text x="70" y="318" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243247">[E1] full -&gt; skip E2 for this subscriber -&gt; publisher continues</text>
<text x="50" y="417" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Blocking sends hold the subscription lock, so unsubscribe waits for that send to finish.</text>
<text x="50" y="449" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Both policies visit subscribers sequentially. A blocked send delays later deliveries.</text></svg>
