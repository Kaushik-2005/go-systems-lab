<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">membership and virtual nodes</title><desc id="desc">Adding D at 30 transfers only the interval after A at 10 through D at 30. Virtual nodes give each physical owner multiple points.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53647a"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/><text x="36" y="49" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#243247">Membership changes and virtual nodes</text>
<text x="36" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">One point per physical node first; virtual nodes repeat physical owners around the ring.</text>
<text x="50" y="135" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243247">Before adding D</text>
<rect x="290" y="110" width="650" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="306" y="143" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">A:10     -&gt;     B:45     -&gt;     C:80     -&gt;     wrap</text>
<text x="50" y="209" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243247">After adding D</text>
<rect x="290" y="182" width="650" height="52" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="306" y="215" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">A:10 -&gt; D:30 -&gt; B:45 -&gt; C:80 -&gt; wrap</text>
<text x="50" y="278" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243247">Only keys in (10, 30] change from B to D. Removing D sends them back to B.</text>
<rect x="50" y="310" width="890" height="65" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="343" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Virtual points: A#0:10, B#0:25, C#0:40, A#1:55, B#1:70, C#1:85</text>
<text x="50" y="418" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243247">Two virtual points per owner split ownership into smaller ranges.</text>
<text x="50" y="449" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Virtual nodes affect placement; they do not create replicated copies of the data.</text></svg>
