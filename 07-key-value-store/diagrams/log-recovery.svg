<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">log recovery</title><desc id="desc">Replaying puts for language and database followed by a language tombstone recovers only database.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53647a"/></marker></defs><rect width="1000" height="450" fill="#ffffff"/><text x="36" y="49" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#243247">Recovery: replay mutations in file order</text>
<text x="36" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Open reads newline-delimited JSON records and applies them to an initially empty map.</text>
<rect x="50" y="125" width="440" height="210" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="158" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Log on disk</text>
<text x="70" y="200" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243247">1. PUT language = Go</text>
<text x="70" y="246" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#243247">2. PUT database = systems</text>
<text x="70" y="292" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#b91c1c">3. DELETE language</text>
<path d="M 500 232 L 600 232" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="610" y="155" width="340" height="150" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="626" y="188" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">Recovered map</text>
<text x="630" y="237" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#166534">database = systems</text>
<text x="630" y="278" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">language: absent</text>
<text x="50" y="403" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Later puts replace earlier values. Tombstones prevent deleted keys from reappearing.</text>
<text x="50" y="436" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Malformed JSON or a scanner error makes Open fail; partial-tail repair is not provided.</text></svg>
