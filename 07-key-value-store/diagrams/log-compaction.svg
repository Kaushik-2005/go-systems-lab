<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">log compaction</title><desc id="desc">Compaction replaces an old four-record log with one put for the surviving language value Rust.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53647a"/></marker></defs><rect width="1000" height="450" fill="#ffffff"/><text x="36" y="49" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#243247">Compaction: keep live values, discard obsolete history</text>
<text x="36" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Compact holds the write lock while replacing the log; reads and mutations wait.</text>
<rect x="50" y="120" width="400" height="225" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="153" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">Old log</text>
<text x="70" y="188" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#53647a">PUT language = Go</text>
<text x="70" y="230" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#166534">PUT language = Rust</text>
<text x="70" y="272" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#53647a">PUT temporary = value</text>
<text x="70" y="314" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#53647a">DELETE temporary</text>
<path d="M 460 230 L 545 230" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="555" y="165" width="395" height="125" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="571" y="198" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">New compacted log</text>
<text x="575" y="241" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#166534">PUT language = Rust</text>
<text x="50" y="398" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Write live entries to a temporary file -&gt; flush and sync -&gt; close -&gt; rename -&gt; reopen.</text>
<text x="50" y="432" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">The recovered map is unchanged, but older values and tombstones no longer occupy the log.</text></svg>
