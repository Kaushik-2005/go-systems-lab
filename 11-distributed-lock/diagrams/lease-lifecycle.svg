<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">lease lifecycle</title><desc id="desc">A acquires and renews token one. After A expires B acquires token two, and stale owner/token operations fail.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53647a"/></marker></defs><rect width="1000" height="470" fill="#fff"/><text x="36" y="49" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#243247">Lease ownership: one current owner and fencing token</text>
<text x="36" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Example TTL = 5 seconds; all ownership checks happen while holding one mutex.</text>
<rect x="50" y="125" width="420" height="80" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="66" y="158" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">A acquires at t = 0s</text>
<text x="68" y="185" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Token = 1; expiration = 5s</text>
<rect x="530" y="125" width="420" height="80" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="546" y="158" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#b91c1c">B attempts at t = 2s</text>
<text x="548" y="185" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Rejected while A holds the lease</text>
<rect x="50" y="255" width="420" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="288" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">A renews at t = 3s</text>
<text x="68" y="315" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Expiration becomes 8s; token stays 1</text>
<rect x="530" y="255" width="420" height="80" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="546" y="288" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">B acquires at t = 9s</text>
<text x="548" y="315" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">A has expired; B receives token 2</text>
<path d="M 480 165 L 520 165" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 480 295 L 520 295" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="50" y="408" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">Renew / Release require the current owner and token. Old owner A cannot alter B's lease.</text>
<text x="50" y="444" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">Expiration is checked on Acquire, Renew, and Release; no reaper goroutine is needed.</text></svg>
