<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">sliding window log</title><desc id="desc">At 25 seconds three recent timestamps fill the rolling window. At 29 seconds an older timestamp expires, admitting the next request.</desc><rect width="1000" height="440" fill="#ffffff"/><text x="36" y="50" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#243247">Sliding-window log: only recent timestamps count</text>
<text x="36" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">One key  |  limit = 3 requests  |  window = 10 seconds</text>
<rect x="245" y="120" width="550" height="130" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="265" y="148" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">At now = 25s, retain timestamps from 15s through 25s</text>
<line x1="80" y1="202" x2="910" y2="202" stroke="#53647a" stroke-width="2"/>
<circle cx="80" cy="202" r="9" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="64" y="235" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#166534">12s</text>
<circle cx="410" cy="202" r="9" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="394" y="235" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#166534">18s</text>
<circle cx="630" cy="202" r="9" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="614" y="235" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#166534">22s</text>
<circle cx="740" cy="202" r="9" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="724" y="235" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#166534">24s</text>
<circle cx="795" cy="202" r="9" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="779" y="235" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b91c1c">25s</text>
<text x="45" y="275" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#53647a">12s is removed</text>
<text x="300" y="276" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b91c1c">3 recent timestamps -&gt; reject at 25s</text>
<rect x="60" y="312" width="880" height="84" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="80" y="342" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">At 29s, the cutoff moves to 19s: 18s drops out, leaving 22s and 24s.</text>
<text x="80" y="373" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#166534">The request at 29s passes and appends 29s. Rejections never enter the log.</text></svg>
