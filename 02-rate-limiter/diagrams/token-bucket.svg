<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">token bucket</title><desc id="desc">Requests use tokens. Elapsed time supplies replacement tokens.</desc><rect width="1000" height="470" fill="#ffffff"/><text x="36" y="50" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#243247">Token bucket: spend a burst, then wait for refill</text>
<text x="36" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">One key  |  capacity = 5 tokens  |  refill rate = 2 tokens per second</text>
<rect x="60" y="148" width="210" height="134" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="76" y="222" width="26" height="34" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<rect x="112" y="222" width="26" height="34" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<rect x="148" y="222" width="26" height="34" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<rect x="184" y="222" width="26" height="34" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<rect x="220" y="222" width="26" height="34" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="76" y="185" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243247">Initially full</text>
<text x="76" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">5 tokens available</text>
<rect x="395" y="148" width="210" height="134" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="411" y="222" width="26" height="34" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<rect x="447" y="222" width="26" height="34" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<rect x="483" y="222" width="26" height="34" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<rect x="519" y="222" width="26" height="34" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<rect x="555" y="222" width="26" height="34" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="411" y="185" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243247">After five requests</text>
<text x="411" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">0 tokens available</text>
<rect x="730" y="148" width="210" height="134" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<rect x="746" y="222" width="26" height="34" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<rect x="782" y="222" width="26" height="34" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<rect x="818" y="222" width="26" height="34" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<rect x="854" y="222" width="26" height="34" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<rect x="890" y="222" width="26" height="34" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="746" y="185" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243247">After 0.5 seconds</text>
<text x="746" y="310" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#243247">1 token available</text>
<line x1="282" y1="209" x2="380" y2="209" stroke="#53647a" stroke-width="2"/>
<text x="275" y="126" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#166534">Spend 5 tokens</text>
<line x1="617" y1="209" x2="715" y2="209" stroke="#53647a" stroke-width="2"/>
<text x="625" y="126" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2563eb">Refill 1 token</text>
<text x="395" y="345" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b91c1c">Next request: reject</text>
<text x="730" y="345" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#166534">Next request: allow</text>
<text x="60" y="401" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243247">On each request: tokens = min(capacity, tokens + elapsed seconds x refill rate).</text>
<text x="60" y="436" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">An accepted request uses one token. Requests trigger refill without a background timer.</text></svg>
