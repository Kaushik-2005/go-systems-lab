<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">ttl and cleanup</title><desc id="desc">An entry with a five-second TTL is returned before expiry and removed on reads at or after expiry. A background scan removes unread expired entries.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#53647a"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M 8 0 L 0 4 L 8 8" fill="none" stroke="#53647a"/></marker></defs><rect width="1000" height="480" fill="#fff"/><text x="36" y="50" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#243247">TTL: expire on read or remove during a cleanup scan</text>
<text x="36" y="84" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">SetWithTTL stores an expiration time on the same entry used by the LRU list.</text>
<rect x="50" y="130" width="260" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="66" y="164" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">SetWithTTL(k, v, 5s)</text>
<path d="M 316 162 L 510 162" fill="none" stroke="#53647a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="520" y="130" width="430" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="536" y="164" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#2563eb">expiresAt = insertion time + 5s</text>
<rect x="50" y="250" width="420" height="105" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="66" y="284" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#166534">Get(k) before expiration</text>
<text x="68" y="316" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243247">Return v and move entry to the head.</text>
<rect x="530" y="250" width="420" height="105" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="546" y="284" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#b91c1c">Get(k) at or after expiration</text>
<text x="548" y="316" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243247">Remove from map and list; return miss.</text>
<text x="50" y="413" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#243247">CleanupExpired scans all entries, so unread expired keys can also be removed.</text>
<text x="50" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#53647a">StartCleanup runs that scan on a ticker until its context is canceled.</text></svg>
